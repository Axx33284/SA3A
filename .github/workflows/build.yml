name: Windows installer

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore: ['island/**', '.github/workflows/winisland.yml']
  workflow_dispatch:
    inputs:
      release:
        description: Publish the installer as a GitHub Release
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (prayer times, Hijri dates, Qibla)
        run: npm test

      - name: Build SA3A-Setup.exe
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Install, launch and uninstall on a real Windows machine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem dist\SA3A-Setup-*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\SA3A'
          if (!(Test-Path "$dir\SA3A.exe")) { throw 'SA3A.exe was not installed' }
          if (!(Test-Path "$dir\Uninstall SA3A.exe")) { throw 'Uninstaller is missing' }
          if (!(Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\SA3A.lnk")) { throw 'Start menu shortcut is missing' }
          $entry = Get-ChildItem HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall | Where-Object { (Get-ItemProperty $_.PSPath).DisplayName -like 'SA3A*' }
          if (!$entry) { throw 'SA3A is not listed in Installed apps' }
          Write-Host 'Installed OK'

          $p = Start-Process "$dir\SA3A.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "SA3A exited during start-up (code $($p.ExitCode))" }
          Write-Host 'Launched OK'
          Get-Process SA3A -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 3

          # Pretend "Start with Windows" was on, then check the uninstaller removes it.
          New-ItemProperty -Path HKCU:\Software\Microsoft\Windows\CurrentVersion\Run -Name SA3A -Value "`"$dir\SA3A.exe`" --hidden" -Force | Out-Null
          Start-Process "$dir\Uninstall SA3A.exe" -ArgumentList '/S' -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path "$dir\SA3A.exe"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$dir\SA3A.exe") { throw 'Uninstall left SA3A.exe behind' }
          if ((Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Run).PSObject.Properties.Name -contains 'SA3A') { throw 'Start-with-Windows entry was not removed' }
          Write-Host 'Uninstalled OK'

      - uses: actions/upload-artifact@v4
        with:
          name: SA3A-Setup
          path: dist/SA3A-Setup-*.exe
          if-no-files-found: error

      - name: Read version
        id: ver
        shell: pwsh
        run: echo "version=$((Get-Content package.json | ConvertFrom-Json).version)" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: SA3A ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/SA3A-Setup-*.exe
          body: |
            **Download `SA3A-Setup-${{ steps.ver.outputs.version }}.exe` below and run it.**

            Windows may show "Windows protected your PC" because the installer is not code-signed yet: click **More info → Run anyway**.
            Uninstall any time from Settings → Apps → Installed apps, or Start menu → SA3A → Uninstall.

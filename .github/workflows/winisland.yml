name: WinIsland installer

on:
  push:
    branches: ['**']
    paths: ['island/**', '.github/workflows/winisland.yml']
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: island

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: island/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: UI tests (island + settings window, demo data)
        run: |
          npm install --no-save playwright@1.56.1
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
          xvfb-run -a node scripts/e2e.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WinIsland-screenshots
          path: island/test/screenshots/*.png

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    needs: ui-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: island/package-lock.json

      - name: Build the Windows helper (media, notifications, audio)
        run: |
          dotnet build native/IslandHelper/IslandHelper.csproj -c Release
          dotnet build native/MediaTestPlayer/MediaTestPlayer.csproj -c Release

      - name: Test the helper against real Windows APIs
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\ci-helper-test.ps1 -Helper native\IslandHelper\bin\Release\net48\IslandHelper.exe -Player native\MediaTestPlayer\bin\Release\net48\MediaTestPlayer.exe

      - run: npm ci
      - run: npm test

      - name: Build WinIsland-Setup.exe
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Install, launch and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem dist\WinIsland-Setup-*.exe | Select-Object -First 1
          Write-Host "Installer: $($setup.Name) $([math]::Round($setup.Length / 1MB, 1)) MB"
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\WinIsland'
          if (!(Test-Path "$dir\WinIsland.exe")) { throw 'WinIsland.exe was not installed' }
          if (!(Test-Path "$dir\resources\helper\IslandHelper.exe")) { throw 'IslandHelper.exe is missing from the install' }
          if (!(Test-Path "$dir\Uninstall WinIsland.exe")) { throw 'Uninstaller is missing' }
          if (!(Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\WinIsland.lnk")) { throw 'Start menu shortcut is missing' }
          $entry = Get-ChildItem HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall | Where-Object { (Get-ItemProperty $_.PSPath).DisplayName -like 'WinIsland*' }
          if (!$entry) { throw 'WinIsland is not listed in Installed apps' }
          Write-Host 'Installed OK'

          $p = Start-Process "$dir\WinIsland.exe" -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "WinIsland exited during start-up (code $($p.ExitCode))" }
          $helper = Get-Process IslandHelper -ErrorAction SilentlyContinue
          if (!$helper) { throw 'WinIsland did not start its Windows helper' }
          Write-Host "Launched OK (helper pid $($helper.Id))"

          # Screenshot of the desktop with the island on it
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory -Force dist\screens | Out-Null
          $bmp.Save("$PWD\dist\screens\windows-desktop.png")

          Get-Process WinIsland, IslandHelper -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 3
          New-ItemProperty -Path HKCU:\Software\Microsoft\Windows\CurrentVersion\Run -Name WinIsland -Value "`"$dir\WinIsland.exe`" --hidden" -Force | Out-Null
          Start-Process "$dir\Uninstall WinIsland.exe" -ArgumentList '/S' -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path "$dir\WinIsland.exe"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$dir\WinIsland.exe") { throw 'Uninstall left WinIsland.exe behind' }
          if ((Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Run).PSObject.Properties.Name -contains 'WinIsland') { throw 'Start-with-Windows entry was not removed' }
          Write-Host 'Uninstalled OK'

      - uses: actions/upload-artifact@v4
        with:
          name: WinIsland-Setup
          path: |
            island/dist/WinIsland-Setup-*.exe
            island/dist/screens/*.png
          if-no-files-found: error

      - name: Read version
        id: ver
        shell: pwsh
        run: echo "version=$((Get-Content package.json | ConvertFrom-Json).version)" >> $env:GITHUB_OUTPUT

      - name: Point the release tag at this build
        shell: pwsh
        run: |
          git tag -f "winisland-v${{ steps.ver.outputs.version }}" $env:GITHUB_SHA
          git push -f origin "refs/tags/winisland-v${{ steps.ver.outputs.version }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: winisland-v${{ steps.ver.outputs.version }}
          name: WinIsland ${{ steps.ver.outputs.version }}
          make_latest: false
          overwrite_files: true
          files: island/dist/WinIsland-Setup-*.exe
          body: |
            **Download `WinIsland-Setup-${{ steps.ver.outputs.version }}.exe` below and run it.**

            WinIsland is a Dynamic Island for Windows 10 and 11. It shows notifications, now playing (Spotify, YouTube, YouTube Music, Media Player and more), timers, battery, volume, audio devices and camera/mic indicators at the top of your screen.

            Windows may show "Windows protected your PC" because the installer is not code-signed. Click **More info → Run anyway**.
            Uninstall any time from Settings → Apps → Installed apps.
